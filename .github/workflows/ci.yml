name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 -m pytest tests/ -q
      - run: python3 -m py_compile $(find src tests -name "*.py")
      - run: python3 -c "import yaml, glob; [list(yaml.safe_load_all(open(f))) for f in glob.glob('**/*.y*ml', recursive=True) if '.git' not in f]"
      - run: python3 -c "import json, glob; [json.load(open(f)) for f in glob.glob('**/*.json', recursive=True) if '.git' not in f]"
      - run: PYTHONPATH=src python3 -m runbook_rag ingest --runbooks data/runbooks --out /tmp/store.json
      - run: PYTHONPATH=src python3 -m runbook_rag eval --store /tmp/store.json --eval-set data/eval_set.json --k 3
